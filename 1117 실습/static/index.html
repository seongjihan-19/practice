<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>멀티에이전트 채팅</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: sans-serif; background: #f7f7f8; height: 100vh; display: flex; }

    /* 왼쪽: 채팅 영역 (처음엔 화면 전체) */
    #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #messages { flex: 1; overflow-y: auto; padding: 24px 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    .msg { padding: 12px 16px; border-radius: 12px; margin-bottom: 12px; white-space: pre-wrap; line-height: 1.5; }
    .user { background: #dbeafe; margin-left: 20%; }
    .bot { background: #fff; border: 1px solid #e5e7eb; margin-right: 20%; }
    form { display: flex; gap: 8px; padding: 16px; max-width: 800px; width: 100%; margin: 0 auto; }
    textarea { flex: 1; resize: none; padding: 12px; border-radius: 12px; border: 1px solid #d1d5db; font-size: 15px; }
    button { padding: 0 20px; border: none; border-radius: 12px; background: #111827; color: #fff; cursor: pointer; }
    button:disabled { background: #9ca3af; }

    /* 모드 전환 버튼 (멀티에이전트 / RAG / Agentic RAG) */
    #mode { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; max-width: 800px; width: 100%; margin: 0 auto; padding: 0 16px; }
    #mode-label { font-size: 13px; color: #6b7280; margin-right: 4px; }
    body:not([data-mode]) #mode-label { color: #111827; font-weight: bold; } /* 모드 고르기 전에는 안내 문구 강조 */
    .mode-btn { padding: 6px 14px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; color: #111827; font-size: 13px; }
    .mode-btn.active { background: #111827; color: #fff; border-color: #111827; }

    /* RAG 모드: 조직도 대신 검색 → 답변 흐름 표시 */
    #rag-flow { position: relative; height: 260px; flex-shrink: 0; display: none; }
    #rag-flow svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #rag-flow line { stroke: #4b5563; stroke-width: 2; }
    #rag_search { left: 28%; top: 50%; }
    #rag_answer { left: 72%; top: 50%; }

    /* Agentic RAG 모드: 에이전트 ↔ search_docs 도구 */
    #agentic-flow { position: relative; height: 260px; flex-shrink: 0; display: none; }
    #agentic-flow svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #agentic-flow line { stroke: #4b5563; stroke-width: 2; }
    #ag_agent { left: 28%; top: 50%; font-weight: bold; }
    #ag_search { left: 72%; top: 50%; }

    /* 모드에 맞는 그림만 보이기 */
    body[data-mode="rag"] #org, body[data-mode="agentic"] #org { display: none; }
    body[data-mode="rag"] #rag-flow { display: block; }
    body[data-mode="agentic"] #agentic-flow { display: block; }

    /* 오른쪽: 조직도 + 로그 (첫 입력 전에는 숨김) */
    #panel { display: none; flex: 1; flex-direction: column; border-left: 1px solid #e5e7eb; background: #111827; color: #e5e7eb; min-width: 0; }
    body.split #panel { display: flex; }
    #org { position: relative; height: 260px; flex-shrink: 0; }
    #org svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    #org line { stroke: #4b5563; stroke-width: 2; }
    .node { position: absolute; transform: translate(-50%, -50%); padding: 12px 14px; border-radius: 10px;
            background: #1f2937; border: 2px solid #4b5563; font-size: 13px; text-align: center; white-space: nowrap; }
    #orchestrator { left: 50%; top: 22%; font-weight: bold; }
    #research_agent { left: 17%; top: 78%; }
    #writer_agent { left: 50%; top: 78%; }
    #reviewer_agent { left: 83%; top: 78%; }

    /* Multi-Agentic RAG 모드: 같은 조직도에서 서브 에이전트만 문서·웹·표 검색 에이전트로 바꿔 보이기 */
    #doc_searcher { left: 17%; top: 78%; }
    #web_searcher { left: 50%; top: 78%; }
    #data_analyst { left: 83%; top: 78%; }
    .multirag-node { display: none; }
    body[data-mode="multirag"] .multirag-node { display: block; }
    body[data-mode="multirag"] .agent-node { display: none; }

    /* 작업 중인 에이전트: 형광색 blink */
    .node.working { animation: blink 0.8s infinite; }
    @keyframes blink {
      0%, 100% { border-color: #39ff14; box-shadow: 0 0 16px #39ff14; color: #39ff14; }
      50% { border-color: #4b5563; box-shadow: none; color: #e5e7eb; }
    }

    #log-title { padding: 8px 16px; font-size: 13px; font-weight: bold; border-top: 1px solid #374151; }
    #log { flex: 1; overflow-y: auto; padding: 0 16px 16px; font-family: monospace; font-size: 12px; }
    .log-line { padding: 6px 0; border-bottom: 1px solid #1f2937; white-space: pre-wrap; }
    .log-time { color: #9ca3af; }
    .log-agent { color: #39ff14; }
  </style>
</head>
<body>
  <div id="chat">
    <div id="messages"></div>
    <div id="mode">
      <span id="mode-label">모드를 선택하세요</span>
      <button type="button" class="mode-btn" data-mode="agent">멀티에이전트</button>
      <button type="button" class="mode-btn" data-mode="rag">RAG (문서 검색)</button>
      <button type="button" class="mode-btn" data-mode="agentic">Agentic RAG</button>
      <button type="button" class="mode-btn" data-mode="multirag">Multi-Agentic RAG</button>
    </div>
    <form id="form">
      <!-- 처음에는 모드를 고르기 전까지 입력을 막아 둠 -->
      <textarea id="input" rows="2" placeholder="먼저 위에서 모드를 선택하세요" disabled></textarea>
      <button id="send" disabled>전송</button>
    </form>
  </div>

  <div id="panel">
    <div id="org">
      <!-- 오케스트레이터와 서브 에이전트를 잇는 연결선 -->
      <svg>
        <line x1="50%" y1="22%" x2="17%" y2="78%"></line>
        <line x1="50%" y1="22%" x2="50%" y2="78%"></line>
        <line x1="50%" y1="22%" x2="83%" y2="78%"></line>
      </svg>
      <div class="node" id="orchestrator">오케스트레이터</div>
      <div class="node agent-node" id="research_agent">리서치 에이전트</div>
      <div class="node agent-node" id="writer_agent">작성 에이전트</div>
      <div class="node agent-node" id="reviewer_agent">검토 에이전트</div>
      <div class="node multirag-node" id="doc_searcher">문서 검색<br>(doc_searcher)</div>
      <div class="node multirag-node" id="web_searcher">웹 검색<br>(web_searcher)</div>
      <div class="node multirag-node" id="data_analyst">표 조회<br>(data_analyst)</div>
    </div>
    <div id="rag-flow">
      <!-- RAG 단계: 검색 → 답변 생성 -->
      <svg><line x1="28%" y1="50%" x2="72%" y2="50%"></line></svg>
      <div class="node" id="rag_search">① 문서 조각 검색</div>
      <div class="node" id="rag_answer">② 답변 생성</div>
    </div>
    <div id="agentic-flow">
      <!-- Agentic RAG: 에이전트가 필요할 때 search_docs 도구를 여러 번 호출 -->
      <svg><line x1="28%" y1="50%" x2="72%" y2="50%"></line></svg>
      <div class="node" id="ag_agent">에이전트 (run_agent)</div>
      <div class="node" id="ag_search">search_docs 도구</div>
    </div>
    <div id="log-title">작업 로그</div>
    <div id="log"></div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const log = document.getElementById("log");
    const ENDPOINTS = { agent: "/chat", rag: "/rag", agentic: "/agentic-rag", multirag: "/multi-rag" }; // 모드별 서버 주소
    let mode = null; // 처음에는 선택 안 됨

    // 모드 버튼: 선택 표시, 오른쪽 그림 전환, 처음 고르면 입력창을 열어 줌
    document.querySelectorAll(".mode-btn").forEach(btn => btn.addEventListener("click", () => {
      mode = btn.dataset.mode;
      document.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
      document.body.dataset.mode = mode; // CSS가 이 값으로 맞는 그림을 보여 줌
      document.getElementById("mode-label").textContent = "모드:";
      input.disabled = false;
      send.disabled = false;
      input.placeholder = "메시지를 입력하세요 (Enter 전송, Shift+Enter 줄바꿈)";
      input.focus();
    }));

    // 채팅창에 말풍선 하나 추가
    function addMessage(text, cls) {
      const div = document.createElement("div");
      div.className = "msg " + cls;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    // 작업 로그에 한 줄 추가
    function addLog(agent, text) {
      const div = document.createElement("div");
      div.className = "log-line";
      div.innerHTML = `<span class="log-time">[${new Date().toLocaleTimeString()}]</span> <span class="log-agent"></span> `;
      div.querySelector(".log-agent").textContent = agent;
      div.append(text);
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // 서버 이벤트 하나 처리: 상태면 blink+로그, reply면 답변 표시
    function handleEvent(data, pending) {
      if (data.reply !== undefined) {
        pending.textContent = data.reply;
        return;
      }
      document.getElementById(data.agent).classList.toggle("working", data.status === "working");
      addLog(data.agent, data.log);
    }

    // /chat 응답(JSON Lines)을 한 줄씩 읽어 처리
    async function readStream(res, pending) {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop(); // 아직 덜 받은 마지막 줄은 남겨둠
        lines.filter(l => l.trim()).forEach(l => handleEvent(JSON.parse(l), pending));
      }
    }

    // 서버 /chat 으로 메시지를 보내고 이벤트를 실시간 표시
    async function sendMessage(text) {
      document.body.classList.add("split"); // 첫 입력 시 화면 좌우 분할
      addMessage(text, "user");
      const pending = addMessage("생각 중...", "bot");
      send.disabled = true;
      try {
        const res = await fetch(ENDPOINTS[mode], { // 모드에 따라 보낼 곳 선택
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text }),
        });
        if (res.ok) await readStream(res, pending);
        else pending.textContent = "오류: " + res.status;
      } catch (e) {
        pending.textContent = "오류: " + e.message;
      }
      document.querySelectorAll(".node").forEach(n => n.classList.remove("working")); // 끝나면 blink 정리
      send.disabled = false;
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || !mode) return; // 모드를 고르기 전에는 보내지 않음
      input.value = "";
      sendMessage(text);
    });

    // Enter는 전송, Shift+Enter는 줄바꿈
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        document.getElementById("form").requestSubmit();
      }
    });
  </script>
</body>
</html>
